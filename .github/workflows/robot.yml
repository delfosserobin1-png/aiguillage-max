name: FloRoBot

# La SNCF publie le jeu « tgvmax » une fois par jour, en général vers 4 h 20 UTC.
# Le robot vérifie souvent le matin (les tâches planifiées GitHub prennent parfois du retard),
# puis toutes les 3 heures. S'il n'y a pas de nouvelle version, il s'arrête en quelques secondes.
on:
  schedule:
    - cron: '7,37 4-9 * * *'
    - cron: '23 0-3,10-23/3 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: robot
  cancel-in-progress: false

jobs:
  releve:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      changed: ${{ steps.collect.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tester le moteur
        if: github.event_name == 'push'
        run: node --test test/engine.test.js

      - name: Restaurer l'historique (branche data)
        run: |
          mkdir -p state
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=1 origin data
            git archive FETCH_HEAD | tar -x -C state
          fi
          du -sh state

      - name: Relever les quotas
        id: collect
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOPIC_FLO: ${{ secrets.NTFY_TOPIC_FLO }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          # passages programmés : avant la publication du matin, guetter la SNCF jusqu'à 100 min
          ATTENDRE: ${{ github.event_name == 'schedule' && '100' || '0' }}
        run: |
          export APP_URL="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
          node collector/collect.mjs --state state --config config.json --attendre "$ATTENDRE"

      - name: Sauvegarder l'historique
        if: steps.collect.outputs.changed == 'true'
        run: |
          cd state
          git init -q -b data
          git add -A
          git -c user.name="robot-aiguillage" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Relevé SNCF ${{ steps.collect.outputs.version }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
          du -sh public

      - name: Assembler le site
        if: steps.collect.outputs.changed == 'true' || github.event_name != 'schedule'
        env:
          PAUSE_JSON: ${{ vars.PAUSE }}
        run: |
          mkdir -p _site/data
          cp -r app/. _site/
          cp config.json _site/config.json
          # icônes PNG dessinées à partir de app/icon.svg (sinon on garde celles du dépôt)
          #   icon-*.png : l'icône pleine (iPhone, onglets)
          #   icon-maskable-*.png : la même réduite au centre, car Android n'en montre que les deux tiers
          cat > _site/_masque.html <<'HTML'
          <html><body style="margin:0;background:#0e1a33;overflow:hidden">
          <svg viewBox="0 0 512 512" style="position:absolute;left:0;top:0;width:100%;height:100%"><g transform="translate(107.52 107.52) scale(.58) translate(0 18)">
          <pattern id="t" x="-48" y="428" width="34" height="11" patternUnits="userSpaceOnUse"><rect width="20" height="11" rx="2" fill="#8a6a2c"/></pattern>
          <rect x="-1000" y="418" width="2512" height="9" fill="#ffc845"/><rect x="-1000" y="428" width="2512" height="11" fill="url(#t)"/></g></svg>
          <img src="icon.svg" style="position:absolute;left:21%;top:21%;width:58%;height:58%"></body></html>
          HTML
          for s in 512 192; do
            printf '<html><body style="margin:0;background:#0e1a33"><img src="icon.svg" width="%s" height="%s" style="display:block"></body></html>' $s $s > _site/_icone.html
            google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=$s,$s \
              --screenshot="$PWD/_site/icon-$s.png" "file://$PWD/_site/_icone.html" >/dev/null 2>&1 || echo "icône $s non régénérée"
            google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=$s,$s \
              --screenshot="$PWD/_site/icon-maskable-$s.png" "file://$PWD/_site/_masque.html" >/dev/null 2>&1 \
              || cp "_site/icon-$s.png" "_site/icon-maskable-$s.png"
          done
          rm -f _site/_icone.html _site/_masque.html
          # pause d'un compte : variable PAUSE du dépôt (Settings → Secrets and variables → Actions → Variables),
          # copiée dans le site sans passer par le code ; JSON invalide ou absent → pas de pause
          printf '%s' "$PAUSE_JSON" > _site/pause.json
          node -e "const v=JSON.parse(require('fs').readFileSync('_site/pause.json','utf8'));if(!v||typeof v!=='object')throw 0" 2>/dev/null || echo '{}' > _site/pause.json
          if [ -d state/public ]; then cp -r state/public/. _site/data/; fi
          echo "{\"commit\":\"${GITHUB_SHA::7}\",\"built\":\"$(date -u +%FT%TZ)\"}" > _site/version.json

      - name: Préparer la publication
        if: steps.collect.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publier:
    needs: releve
    if: needs.releve.outputs.changed == 'true' || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
